<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Life Scenes Learning Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-volume-high text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 tracking-tight">生活英语跟读与发音看板</h1>
                    <p class="text-xs text-slate-500">点击卡片随时发音 · 手机电脑同步</p>
                </div>
            </div>

            <!-- Global Controls -->
            <div class="flex items-center space-x-2 sm:space-x-4">
                <!-- Edit Mode Toggle -->
                <button id="toggleEditBtn" onclick="toggleEditMode()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-100 text-amber-700 hover:bg-amber-200 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span id="editText">开启编辑模式</span>
                </button>

                <!-- Speed Control -->
                <div class="hidden sm:flex items-center space-x-1 bg-slate-100 px-2 py-1 rounded-lg text-xs font-medium text-slate-600">
                    <span>语速:</span>
                    <select id="speechRate" class="bg-transparent border-none focus:ring-0 cursor-pointer font-semibold text-indigo-600">
                        <option value="0.7">0.7x (慢)</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1.0x (标准)</option>
                        <option value="1.2">1.2x (快)</option>
                    </select>
                </div>

                <!-- Play All Button -->
                <button onclick="playAllCurrentCategory()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-play"></i>
                    <span class="hidden md:inline">顺序朗读本类</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Sidebar Navigation (Categories) -->
        <aside class="lg:col-span-1 space-y-4">
            <!-- Search Bar -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterCards()" placeholder="搜索单词或句子..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent shadow-sm">
            </div>

            <!-- Categories List -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-2 overflow-hidden">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-3 py-2">场景分类</h2>
                <nav id="categoryNav" class="space-y-1 max-h-[calc(100vh-260px)] overflow-y-auto">
                    <!-- Dynamic generated by JS -->
                </nav>
            </div>

            <!-- Reset / Export Data Controls -->
            <div class="text-center pt-2">
                <button onclick="resetToDefault()" class="text-xs text-slate-400 hover:text-red-500 transition underline">
                    恢复默认初始数据
                </button>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="lg:col-span-3 space-y-6">
            <!-- Active Category Header -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div>
                    <span id="activeCategoryTag" class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-full">全部场景</span>
                    <h2 id="activeCategoryTitle" class="text-xl font-bold text-slate-800 mt-1">全部英文内容</h2>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="itemCountBadge" class="text-xs text-slate-500 bg-slate-100 px-3 py-1 rounded-full font-medium">共 0 条内容</span>
                    <button id="addCardBtn" onclick="openAddModal()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition flex items-center space-x-1">
                        <i class="fa-solid fa-plus"></i>
                        <span>添加卡片</span>
                    </button>
                </div>
            </div>

            <!-- Cards Grid -->
            <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dynamic cards -->
            </div>
        </main>
    </div>

    <!-- Add / Edit Modal -->
    <div id="itemModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex items-center justify-between">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">添加新短语</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <input type="hidden" id="editIndex" value="-1">
            <input type="hidden" id="editCatIndex" value="-1">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">所属分类</label>
                    <select id="modalCategory" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <!-- Options generated dynamically -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">英文原文</label>
                    <textarea id="modalEnglish" rows="2" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="例如: This is your palm."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">中文翻译 / 备注说明</label>
                    <input type="text" id="modalChinese" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="例如: 这是你的手掌。">
                </div>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">取消</button>
                <button onclick="saveCardItem()" class="px-4 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm transition">保存</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 mt-auto">
        <p>生活英语跟读看板 &copy; 2026 · 点击任意英文卡片即可发音</p>
    </footer>

                ]
            },
            {

                items: [

            },
            {

                    { en: "Don't trip over your toys.", zh: "别被玩具绊倒了。" },
                    { en: "Keep fingers out of the door gap. When the door is closing, be careful not to get your fingers caught.", zh: "手不要放在门缝里。关门时，小心别夹到手指。" }
                ]
            },
            {
                category: "下雨天观察",
                icon: "fa-cloud-rain",
                items: [
                    { en: "Look outside. It's raining really hard. It's heavy rain.", zh: "看外面。雨下得真大。这是大雨。" },
                    { en: "The trees are dancing in the wind. Raindrops are falling from the sky.", zh: "树木在风中摇曳。雨滴从天空中落下来。" },
                    { en: "The rain goes pitter-patter on the window.", zh: "雨点在窗户上发出淅淅沥沥的敲打声。" },
                    { en: "Did you see that flash in the sky? That's lightning.", zh: "你看到天上的那个闪光了吗？那是闪电。" },
                    { en: "Do you hear that? It's thunder.", zh: "你听到那个声音了吗？那是雷声。" },
                    { en: "The flash travels faster than the boom, so we saw the flash first, and then we heard the boom.", zh: "闪光比轰鸣声传播得快，所以我们先看到闪电，然后才听到雷声。" },
                    { en: "Here comes the boom again. Cover the ears if it's too loud.", zh: "轰鸣声又来啦。如果声音太大就捂住耳朵。" }
                ]
            },
            {
                category: "水杯倒水",
                icon: "fa-glass-water",
                items: [
                    { en: "Here is a glass. The glass is empty. Let's pour some water in.", zh: "这里有一个玻璃杯。杯子是空的。我们倒点水进去吧。" },
                    { en: "It's just a little bit. It's half full. It's getting full. It's all full.", zh: "只有一点点。半满。快满了。全满啦。" },
                    { en: "Oh, oh, it's spilling over. Take a little sip. Let's wipe it up.", zh: "噢哟，溢出来了。喝一小口。我们把它擦干净吧。" }
                ]
            }
        ];

        // State Management
        let appData = [];
        let currentCategoryIndex = -1; // -1 means all
        let isEditMode = false;
        let speechRate = 1.0;

        // Initialize App
        function initApp() {
            // Load from LocalStorage if exists
            const savedData = localStorage.getItem('english_board_data');
            if (savedData) {
                try {
                    appData = JSON.parse(savedData);
                } catch (e) {
                    appData = JSON.parse(JSON.stringify(defaultData));
                }
            } else {
                appData = JSON.parse(JSON.stringify(defaultData));
            }

            // Setup speed listener
            document.getElementById('speechRate').addEventListener('change', (e) => {
                speechRate = parseFloat(e.target.value);
            });

            renderSidebar();
            renderCards();
            updateCategoryHeader();
        }

        // Render Sidebar Category Navigation
        function renderSidebar() {
            const nav = document.getElementById('categoryNav');
            let html = `
                <button onclick="selectCategory(-1)" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium transition flex items-center justify-between ${currentCategoryIndex === -1 ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'}">
                    <span class="flex items-center space-x-2 truncate"><i class="fa-solid fa-layer-group w-4 text-center"></i><span class="truncate">全部场景</span></span>
                    <span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded-full">${getTotalCount()}</span>
                </button>
            `;

            appData.forEach((cat, idx) => {
                const isActive = currentCategoryIndex === idx;
                html += `
                    <button onclick="selectCategory(${idx})" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium transition flex items-center justify-between ${isActive ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'}">
                        <span class="flex items-center space-x-2 truncate"><i class="fa-solid ${cat.icon || 'fa-folder'} w-4 text-center"></i><span class="truncate">${cat.category}</span></span>
                        <span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded-full">${cat.items.length}</span>
                    </button>
                `;
            });
            nav.innerHTML = html;
        }

        function getTotalCount() {
            let total = 0;
            appData.forEach(c => total += c.items.length);
            return total;
        }

        function selectCategory(index) {
            currentCategoryIndex = index;
            renderSidebar();
            renderCards();
            updateCategoryHeader();
        }

        function updateCategoryHeader() {
            const titleEl = document.getElementById('activeCategoryTitle');
            const tagEl = document.getElementById('activeCategoryTag');
            const countEl = document.getElementById('itemCountBadge');

            if (currentCategoryIndex === -1) {
                tagEl.innerText = "全部场景";
                titleEl.innerText = "全部英文内容";
                countEl.innerText = `共 ${getTotalCount()} 条内容`;
            } else {
                const cat = appData[currentCategoryIndex];
                tagEl.innerText = cat.category;
                titleEl.innerText = cat.category;
                countEl.innerText = `共 ${cat.items.length} 条内容`;
            }
        }

        // Render Cards
        function renderCards(filterText = '') {
            const grid = document.getElementById('cardsGrid');
            let html = '';
            let count = 0;

            const query = filterText.toLowerCase().trim();

            appData.forEach((cat, catIdx) => {
                if (currentCategoryIndex !== -1 && currentCategoryIndex !== catIdx) return;

                cat.items.forEach((item, itemIdx) => {
                    if (query && !item.en.toLowerCase().includes(query) && !item.zh.toLowerCase().includes(query)) {
                        return;
                    }
                    count++;

                    html += `
                        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm card-hover transition flex flex-col justify-between relative group">
                            <!-- Top Category & Actions -->
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-[10px] font-semibold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">${cat.category}</span>
                                ${isEditMode ? `
                                    <div class="flex items-center space-x-1">
                                        <button onclick="openEditModal(${catIdx}, ${itemIdx})" class="text-slate-400 hover:text-indigo-600 p-1 text-xs" title="编辑"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="deleteCardItem(${catIdx}, ${itemIdx})" class="text-slate-400 hover:text-red-600 p-1 text-xs" title="删除"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                ` : `
                                    <button onclick="speakText('${escapeString(item.en)}', event)" class="text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 p-1.5 rounded-lg transition" title="朗读">
                                        <i class="fa-solid fa-volume-high text-xs"></i>
                                    </button>
                                `}
                            </div>

                            <!-- Main Content (Clickable for Speech if not in edit mode) -->
                            <div onclick="${isEditMode ? '' : `speakText('${escapeString(item.en)}', event)`}" class="${isEditMode ? '' : 'cursor-pointer'} space-y-1.5 py-1">
                                <p class="text-sm font-semibold text-slate-800 leading-snug">${highlightSearch(item.en, query)}</p>
                                <p class="text-xs text-slate-500">${highlightSearch(item.zh, query)}</p>
                            </div>
                        </div>
                    `;
                });
            });

            if (count === 0) {
                html = `
                    <div class="col-span-full py-12 text-center text-slate-400">
                        <i class="fa-regular fa-face-smile-wink text-3xl mb-2"></i>
                        <p class="text-sm">没有找到匹配的英文短语</p>
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        function highlightSearch(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<mark class="bg-amber-200 text-slate-900 rounded px-0.5">$1</mark>');
        }

        function escapeString(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function filterCards() {
            const query = document.getElementById('searchInput').value;
            renderCards(query);
        }

        // Text to Speech Function
        function speakText(text, event) {
            if (event) event.stopPropagation();
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音朗读功能，请使用手机 Safari 或 Chrome 浏览器。');
                return;
            }
            window.speechSynthesis.cancel(); // Stop previous speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = speechRate;
            window.speechSynthesis.speak(utterance);
        }

        // Play All in current category
        async function playAllCurrentCategory() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            let itemsToPlay = [];
            appData.forEach((cat, catIdx) => {
                if (currentCategoryIndex !== -1 && currentCategoryIndex !== catIdx) return;
                cat.items.forEach(item => itemsToPlay.push(item.en));
            });

            if (itemsToPlay.length === 0) return;

            for (let enText of itemsToPlay) {
                await new Promise((resolve) => {
                    const utterance = new SpeechSynthesisUtterance(enText);
                    utterance.lang = 'en-US';
                    utterance.rate = speechRate;
                    utterance.onend = resolve;
                    utterance.onerror = resolve;
                    window.speechSynthesis.speak(utterance);
                });
                // Small pause between items
                await new Promise(r => setTimeout(r, 400));
            }
        }

        // Edit Mode Toggle
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btnText = document.getElementById('editText');
            const btn = document.getElementById('toggleEditBtn');
            const addBtn = document.getElementById('addCardBtn');

            if (isEditMode) {
                btnText.innerText = "退出编辑";
                btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow-sm transition flex items-center space-x-1.5";
                addBtn.classList.remove('hidden');
            } else {
                btnText.innerText = "开启编辑模式";
                btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-100 text-amber-700 hover:bg-amber-200 transition flex items-center space-x-1.5";
                addBtn.classList.add('hidden');
            }
            renderCards(document.getElementById('searchInput').value);
        }

        // Modal Operations
        function openAddModal() {
            document.getElementById('modalTitle').innerText = "添加新短语";
            document.getElementById('editIndex').value = -1;
            document.getElementById('editCatIndex').value = currentCategoryIndex === -1 ? 0 : currentCategoryIndex;
            document.getElementById('modalEnglish').value = '';
            document.getElementById('modalChinese').value = '';
            populateModalCategorySelect();
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function openEditModal(catIdx, itemIdx) {
            const item = appData[catIdx].items[itemIdx];
            document.getElementById('modalTitle').innerText = "编辑短语";
            document.getElementById('editIndex').value = itemIdx;
            document.getElementById('editCatIndex').value = catIdx;
            document.getElementById('modalEnglish').value = item.en;
            document.getElementById('modalChinese').value = item.zh;
            populateModalCategorySelect(catIdx);
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function populateModalCategorySelect(selectedIdx = 0) {
            const select = document.getElementById('modalCategory');
            let html = '';
            appData.forEach((cat, idx) => {
                html += `<option value="${idx}" ${idx === selectedIdx ? 'selected' : ''}>${cat.category}</option>`;
            });
            select.innerHTML = html;
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        function saveCardItem() {
            const catIdx = parseInt(document.getElementById('modalCategory').value);
            const itemIdx = parseInt(document.getElementById('editIndex').value);
            const enText = document.getElementById('modalEnglish').value.trim();
            const zhText = document.getElementById('modalChinese').value.trim();

            if (!enText) {
                alert('请输入英文原文！');
                return;
            }

            if (itemIdx === -1) {
                // Add new
                appData[catIdx].items.push({ en: enText, zh: zhText || '暂无翻译' });
            } else {
                // Edit existing
                const oldCatIdx = parseInt(document.getElementById('editCatIndex').value);
                if (oldCatIdx !== catIdx) {
                    // Moved to another category
                    appData[oldCatIdx].items.splice(itemIdx, 1);
                    appData[catIdx].items.push({ en: enText, zh: zhText });
                } else {
                    appData[catIdx].items[itemIdx] = { en: enText, zh: zhText };
                }
            }

            saveAndRefresh();
            closeModal();
        }

        function deleteCardItem(catIdx, itemIdx) {
            if (confirm('确定要删除这条短语吗？')) {
                appData[catIdx].items.splice(itemIdx, 1);
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('english_board_data', JSON.stringify(appData));
            renderSidebar();
            renderCards(document.getElementById('searchInput').value);
            updateCategoryHeader();
        }

        function resetToDefault() {
            if (confirm('确定要恢复为默认初始数据吗？你所有自定义修改的内容将会被重置。')) {
                localStorage.removeItem('english_board_data');
                appData = JSON.parse(JSON.stringify(defaultData));
                currentCategoryIndex = -1;
                isEditMode = false;
                document.getElementById('editText').innerText = "开启编辑模式";
                document.getElementById('toggleEditBtn').className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-100 text-amber-700 hover:bg-amber-200 transition flex items-center space-x-1.5";
                document.getElementById('addCardBtn').classList.add('hidden');
                renderSidebar();
                renderCards();
                updateCategoryHeader();
            }
        }

        // Run on load
        window.onload = initApp;
    </script>
</body>
</html>
