            if (!synth) return;
            voices = synth.getVoices();

                let matchingPhrasesCount = 0;

                        p.toLowerCase().includes(filterText.toLowerCase())
                    ).length;
                    if (matchingPhrasesCount === 0 && !cat.title.toLowerCase().includes(filterText.toLowerCase())) {

                    }
                }

                        : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50'
                }`;

                    if (window.innerWidth < 1024) toggleSidebar(false);
                    stopAudio();
                    renderCards();
                    renderSidebar();
                };

                btn.innerHTML = `
                    <span class="truncate pr-2">${cat.title}</span>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 group-hover:bg-slate-200 dark:group-hover:bg-slate-600 transition-colors">
                        ${isSearching ? matchingPhrasesCount : cat.phrases.length}
                    </span>
                `;
                categoryNav.appendChild(btn);
            });
        }

        // Render Phrase Cards
        function renderCards() {
            cardsGrid.innerHTML = '';
            const searchVal = searchInput.value.trim().toLowerCase();

            if (searchVal) {
                // Global search mode across all categories
                currentCategoryTitle.textContent = `搜索结果: "${searchVal}"`;
                let foundTotal = 0;

                rawData.forEach((cat) => {
                    cat.phrases.forEach((phrase, pIdx) => {
                        if (phrase.toLowerCase().includes(searchVal) || cat.title.toLowerCase().includes(searchVal)) {
                            foundTotal++;
                            cardsGrid.appendChild(createCardElement(phrase, cat.title, foundTotal - 1));
                        }
                    });
                });

                phraseCountBadge.textContent = `${foundTotal} 条匹配`;
                if (foundTotal === 0) {
                    cardsGrid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">未查找到匹配的英文短语</div>`;
                }
                return;
            }

            // Standard Category View
            const cat = rawData[currentCategoryIndex];
            currentCategoryTitle.textContent = cat.title;
            phraseCountBadge.textContent = `${cat.phrases.length} 条句段`;

            cat.phrases.forEach((phrase, index) => {
                cardsGrid.appendChild(createCardElement(phrase, null, index));
            });
        }

        // Create individual card element
        function createCardElement(text, categoryTag, index) {
            const card = document.createElement('div');
            const isPlaying = currentlyPlayingCardIndex === index;

            card.className = `group relative p-4 rounded-xl border transition-all duration-200 cursor-pointer flex flex-col justify-between touch-highlight-none ${
                isPlaying 
                    ? 'bg-sky-50 dark:bg-sky-900/30 border-sky-400 dark:border-sky-500 ring-2 ring-sky-400/20 shadow-md' 
                    : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-sky-300 dark:hover:border-slate-600 hover:shadow-sm'
            }`;

            card.onclick = () => {
                speakSingle(text, index);
            };

            // Clean English text for speech API (remove Chinese notes like 柑橘味的)
            const cleanText = text.replace(/[\u4e00-\u9fa5]/g, '').trim();

            card.innerHTML = `
                <div>
                    ${categoryTag ? `<span class="inline-block mb-1.5 text-xs text-sky-600 dark:text-sky-400 font-semibold">${categoryTag}</span>` : ''}
                    <p class="text-base sm:text-lg font-medium text-slate-800 dark:text-slate-100 leading-relaxed pr-8">
                        ${highlightCleanText(text)}
                    </p>
                </div>
                <div class="mt-3 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500 pt-2 border-t border-slate-100 dark:border-slate-700/50">
                    <span class="flex items-center gap-1">
                        <i class="ph ph-hash"></i> ${index + 1}
                    </span>
                    <div class="flex items-center gap-2">
                        <button onclick="event.stopPropagation(); copyText('${escapeQuotes(text)}')" class="p-1 hover:text-sky-600 dark:hover:text-sky-400 transition-colors" title="复制文本">
                            <i class="ph ph-copy text-base"></i>
                        </button>
                        <button class="p-1.5 rounded-full ${isPlaying ? 'text-sky-600 dark:text-sky-400 bg-sky-100 dark:bg-sky-900/50 animate-pulse' : 'text-slate-400 group-hover:text-sky-600 dark:group-hover:text-sky-400'}" title="发音">
                            <i class="ph ${isPlaying ? 'ph-speaker-high-fill' : 'ph-speaker-high'} text-lg"></i>
                        </button>
                    </div>
                </div>
            `;
            return card;
        }

        function highlightCleanText(text) {
            // Keep original punctuation and formatting intact
            return text;
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        // Copy Text
        function copyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast('已复制到剪贴板');
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50 animate-fade-in';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        // Speech Functions
        function speakSingle(rawText, cardIndex) {
            stopAudio();
            currentlyPlayingCardIndex = cardIndex;
            renderCards();

            // Strip Chinese characters for SpeechSynthesis
            const textToSpeak = rawText.replace(/[\u4e00-\u9fa5]+/g, '').trim();
            if (!textToSpeak) return;

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.rate = parseFloat(rateRange.value);
            utterance.lang = voiceSelect.value;

            // Try selecting specific accent voice
            if (voices.length > 0) {
                const matchedVoice = voices.find(v => v.lang.includes(voiceSelect.value.replace('-', '_')) || v.lang.includes(voiceSelect.value));
                if (matchedVoice) utterance.voice = matchedVoice;
            }

            utterance.onend = () => {
                currentlyPlayingCardIndex = null;
                renderCards();
            };

            utterance.onerror = () => {
                currentlyPlayingCardIndex = null;
                renderCards();
            };

            activeUtterance = utterance;
            synth.speak(utterance);
        }

        function playSequence() {
            stopAudio();
            isPlayingSequence = true;
            sequenceIndex = 0;
            playNextInSequence();
        }

        function playNextInSequence() {
            if (!isPlayingSequence) return;

            const currentPhrases = rawData[currentCategoryIndex].phrases;
            if (sequenceIndex >= currentPhrases.length) {
                isPlayingSequence = false;
                currentlyPlayingCardIndex = null;
                renderCards();
                return;
            }

            const phrase = currentPhrases[sequenceIndex];
            currentlyPlayingCardIndex = sequenceIndex;
            renderCards();

            // Scroll card into view
            const cardElem = cardsGrid.children[sequenceIndex];
            if (cardElem) {
                cardElem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            const cleanText = phrase.replace(/[\u4e00-\u9fa5]+/g, '').trim();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = parseFloat(rateRange.value);
            utterance.lang = voiceSelect.value;

            utterance.onend = () => {
                if (isPlayingSequence) {
                    sequenceIndex++;
                    setTimeout(playNextInSequence, 400); // Small pause between phrases
                }
            };

            utterance.onerror = () => {
                isPlayingSequence = false;
                currentlyPlayingCardIndex = null;
                renderCards();
            };

            synth.speak(utterance);
        }

        function stopAudio() {
            isPlayingSequence = false;
            currentlyPlayingCardIndex = null;
            if (synth) synth.cancel();
        }

        // Event Listeners
        rateRange.addEventListener('input', (e) => {
            rateVal.textContent = `${e.target.value}x`;
        });

        playAllBtn.addEventListener('click', playSequence);
        stopBtn.addEventListener('click', stopAudio);

        searchInput.addEventListener('input', (e) => {
            renderSidebar(e.target.value);
            renderCards();
        });

        // Theme Toggle
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Mobile Sidebar Drawer Control
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');

        function toggleSidebar(open) {
            if (open) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        }

        toggleSidebarBtn.addEventListener('click', () => toggleSidebar(true));
        sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

        // Initial Initialization
        renderSidebar();
        renderCards();
    </script>
</body>
</html>
